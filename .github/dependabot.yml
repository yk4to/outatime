# Opens PRs that update the actions in .github/workflows and the settings app's NuGet
# packages. The C++ dependencies are fetched by CMake from a pinned URL and hash, which
# Dependabot doesn't update: bump those by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: nuget
    directory: /src/Outatime.Settings
    schedule:
      interval: monthly
    # The Windows App SDK is updated by hand. Dependabot bumped the parts the csproj
    # excludes without the SDK itself, which mixes SDK versions; an update also needs
    # the settings app run to check it, not just built.
    ignore:
      - dependency-name: Microsoft.WindowsAppSDK*
      - dependency-name: Microsoft.Windows.AI.MachineLearning
      - dependency-name: System.Numerics.Tensors
