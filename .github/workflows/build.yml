name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Same version as the clang-format bundled with Visual Studio.
      - name: Check C++ formatting
        run: pipx run clang-format==22.1.3 --dry-run --Werror src/Outatime/*.cpp src/Outatime/*.hpp tests/*.cpp

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build and package
        run: ./scripts/package.ps1
      # package.ps1 configures and builds the Release tree, tests included.
      - name: Run tests
        run: ctest --preset release
      - name: Check C# formatting
        run: dotnet format src/Outatime.Settings --verify-no-changes --no-restore
      # Visual Studio's clang-tidy, the same version as locally. Uses .clang-tidy and
      # compile_flags.txt, which needs the dependencies fetched by the configure above.
      - name: Run clang-tidy
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $tidy = & $vswhere -latest -find 'VC\Tools\Llvm\x64\bin\clang-tidy.exe'
          if (-not $tidy) { throw 'clang-tidy was not found in Visual Studio' }
          & $tidy --version
          $failed = (Get-ChildItem src/Outatime/*.cpp, tests/*.cpp).FullName | ForEach-Object -ThrottleLimit 4 -Parallel {
            & $using:tidy --quiet --warnings-as-errors='*' $_ | Out-Host
            if ($LASTEXITCODE -ne 0) { $_ }
          }
          if ($failed) { throw "clang-tidy found problems in: $failed" }
      - uses: actions/upload-artifact@v7
        with:
          name: Outatime-win-x64
          path: dist/Outatime/
